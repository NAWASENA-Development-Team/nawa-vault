# netlify.toml — NAWA-VAULT Deployment Config
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "bun run build"
  publish = ".next"

[build.environment]
  # Bun version — cek versi terbaru di https://bun.sh
  BUN_VERSION = "1.2.0"
  # Node masih dibutuhkan oleh beberapa tooling Next.js internals
  NODE_VERSION = "20"

# Next.js on Netlify — handled by @netlify/plugin-nextjs
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Headers ──────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self)"

# Static assets — long cache
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# QR images
[[headers]]
  for = "/api/assets/*/qr"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[functions]
  node_bundler = "esbuild"
